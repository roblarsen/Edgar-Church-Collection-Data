name: Monthly Pedigree Verification Report

on:
  schedule:
    # 06:00 UTC on the 1st of every month
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit-pedigree-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pandas

      - name: Download Feed from Google Sheet
        env:
          FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
        run: |
          mkdir -p data
          curl -fsSL "https://docs.google.com/spreadsheets/d/${FILE_ID}/export?format=csv" -o data/church_pedigree_live_feed.csv
          
          if [ ! -s data/church_pedigree_live_feed.csv ]; then
            echo "Error: Live feed download failed or file is empty."
            exit 1
          fi

      - name: Generate Issue Verification Report
        run: python scripts/reconcile_monthly_feed.py

      - name: Create GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f issue_body.md ]; then
            gh issue create \
              --title "Edgar Church Monthly Ingestion Audit - $(date +'%B %Y')" \
              --body-file issue_body.md \
              --label "census,verification"
          else
            echo "No issue report generated."
          fi
