name: Monthly Pedigree Reconciliation

on:
  schedule:
    # 06:00 UTC on the 1st of every month
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pandas

      - name: Download Feed from Google Sheet
        env:
          FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
        run: |
          mkdir -p data
          curl -fsSL "https://docs.google.com/spreadsheets/d/${FILE_ID}/export?format=csv" -o data/church_pedigree_live_feed.csv
          
          if [ ! -s data/church_pedigree_live_feed.csv ]; then
            echo "Error: Live feed download failed or file is empty."
            exit 1
          fi

      - name: Run Reconciliation Across src/
        run: python scripts/reconcile_monthly_feed.py

      - name: Read Summary Body
        id: summary
        run: |
          if [ -f reconcile_summary.md ]; then
            BODY=$(cat reconcile_summary.md)
          else
            BODY="Monthly Church Pedigree Census Reconciliation."
          fi
          # Escape multiline output for GitHub Actions
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "PR_BODY<<$EOF" >> $GITHUB_ENV
          echo "$BODY" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "data(census): monthly church pedigree reconciliation"
          branch: "automated/monthly-pedigree-reconcile"
          delete-branch: true
          title: "Data: Monthly Church Pedigree Census Reconciliation"
          body: ${{ env.PR_BODY }}
          labels: |
            census
            automated-pr
